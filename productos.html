<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mueblería Hermanos Jota</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

    <!-- HEADER GLOBAL -->
    <header class="site-header">
        <div class="header-container">
            <div class="logo">
                <a href="index.html">
                    <img src="./img/logo.svg" alt="Logo Mueblería Hermanos Jota" class="logo-img">
                </a>
            </div>
            <nav class="main-nav">
                <ul class="nav-list">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="productos.html">Catálogo</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
            <div class="cart-widget">
                <a href="productos.html" id="cart-link">🛒 <span id="cart-counter">0</span></a>
            </div>
        </div>
    </header>

    <!-- MAIN (Acá cada uno inyecta el contenido de su página) -->
    <main>
        <div class="filter-bar">
            <div class="sort-box">
                <label for="sort">Ordenar por:</label>
                <select id="sort" name="sort">
                    <option value="price-low">Precio: Menor a Mayor</option>
                    <option value="price-high">Precio: Mayor a Menor</option>
                    <option value="newest">Más nuevos</option>
                </select>
            </div>
            <div class="search-box">
                <input type="search" id="search-input" placeholder="Buscar productos..." aria-label="Buscar productos">
                <button type="submit" id="search-submit" aria-label="Buscar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>
        </div>

        <ul class="productos-grid" id="product-list">
        </ul>
    </main>

    <!-- FOOTER GLOBAL -->
    <footer class="site-footer">
        <div class="footer-container">
            <p>&copy; 2026 Mueblería Hermanos Jota. Todos los derechos reservados.</p>
            <ul class="footer-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Catálogo</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </div>
    </footer>

    <script src="js/products.js"></script>
</body>
</html>
