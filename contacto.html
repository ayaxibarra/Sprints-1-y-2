<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mueblería Hermanos Jota</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

    <!-- HEADER GLOBAL -->
    <header class="site-header">
        <div class="header-container">
            <div class="logo">
                <a href="index.html">
                    <img src="./img/logo.svg" alt="Logo Mueblería Hermanos Jota" class="logo-img">
                </a>
            </div>
            <nav class="main-nav">
                <ul class="nav-list">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="productos.html">Catálogo</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
            <div class="cart-widget">
                <a href="productos.html" id="cart-link">🛒 <span id="cart-counter">0</span></a>
            </div>
        </div>
    </header>

    <!-- MAIN -->
    <main>
        <section id="contacto">
            <h2>Escribinos</h2>
            <p>¿Tenés una consulta sobre nuestros muebles o necesitás asesoramiento? Completá el formulario y te respondemos a la brevedad.</p>

            <form id="formulario-contacto" action="#" method="post" novalidate>
                <div class="grupo-campo">
                    <label for="nombreCompleto">Nombre Completo</label>
                    <input type="text" id="nombreCompleto" name="nombreCompleto" autocomplete="name" required>
                </div>

                <div class="grupo-campo">
                    <label for="correoElectronico">Correo Electrónico</label>
                    <input type="email" id="correoElectronico" name="correoElectronico" autocomplete="email" required>
                </div>

                <div class="grupo-campo">
                    <label for="mensajeConsulta">Mensaje o Consulta</label>
                    <textarea id="mensajeConsulta" name="mensajeConsulta" rows="5" required></textarea>
                </div>

                <button type="submit" id="btn-enviar">Enviar Mensaje</button>
            </form>
        </section>
    </main>

    <!-- FOOTER GLOBAL -->
    <footer class="site-footer">
        <div class="footer-container">
            <p>&copy; 2026 Mueblería Hermanos Jota. Todos los derechos reservados.</p>
            <ul class="footer-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Catálogo</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </div>
    </footer>
    <script src="./js/carrito.js" defer></script>
    <script src="./js/contacto.js" defer></script>
</body>
</html>
